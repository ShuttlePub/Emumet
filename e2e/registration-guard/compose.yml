# Standalone project; never combine with the production compose.yml.
services:
  postgres:
    image: docker.io/postgres:16
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: kratos
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m,mode=0700
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guard -d kratos]
      interval: 1s
      timeout: 3s
      retries: 60
  guard:
    image: docker.io/python:3.12-alpine
    command: [python3, /fixture/stub.py]
    volumes: [.:/fixture:ro]
    ports: ["127.0.0.1:18445:8080"]
  kratos-migrate:
    profiles: [migration]
    image: docker.io/oryd/kratos:v1.3.1
    environment:
      DSN: postgres://guard:fixture-only@postgres:5432/kratos?sslmode=disable
    command: [migrate, sql, -e, --yes]
    tmpfs:
      - /var/lib/sqlite:rw,size=8m,mode=0777
      - /home/ory:rw,size=8m,mode=0777
  kratos:
    image: docker.io/oryd/kratos:v1.3.1
    environment:
      DSN: postgres://guard:fixture-only@postgres:5432/kratos?sslmode=disable
    command: [serve, -c, /runtime/kratos.json, --dev, --watch-courier]
    volumes:
      - .:/fixture:ro
      - ./artifacts/runtime:/runtime:ro
    tmpfs:
      - /var/lib/sqlite:rw,size=8m,mode=0777
      - /home/ory:rw,size=8m,mode=0777
    ports: ["127.0.0.1:18433:4433", "127.0.0.1:18434:4434"]
  app:
    profiles: [account]
    build:
      context: ../..
      dockerfile: e2e/registration-guard/Dockerfile.account
    image: emumet-registration-guard-account:fixture
    working_dir: /app
    tmpfs:
      - /app:rw,size=32m,mode=0700
    environment:
      DATABASE_URL: postgres://guard:fixture-only@postgres:5432/emumet?sslmode=disable
      HYDRA_ISSUER_URL: http://guard:8080
      HYDRA_ADMIN_URL: http://guard:8080
      KETO_READ_URL: http://guard:8080
      KETO_WRITE_URL: http://guard:8080
      KRATOS_PUBLIC_URL: http://kratos:4433
      EXPECTED_AUDIENCE: account
      PUBLIC_BASE_URL: http://app:8080
      S3_ENDPOINT: http://guard:8080
      S3_ACCESS_KEY: fixture-only
      S3_SECRET_KEY: fixture-only
      AWS_EC2_METADATA_DISABLED: "true"
      WORKER_ID: "4"
    volumes:
      - .:/fixture:ro
      - ./artifacts/runtime/master-key-password:/run/secrets/master-key-password:ro
