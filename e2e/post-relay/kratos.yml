{
  "serve": {
    "public": {
      "base_url": "http://127.0.0.1:14433/",
      "port": 14433
    },
    "admin": {
      "base_url": "http://127.0.0.1:14434/",
      "port": 14434
    }
  },
  "selfservice": {
    "default_browser_return_url": "http://127.0.0.1:3000/",
    "flows": {
      "registration": {
        "enabled": true,
        "ui_url": "http://127.0.0.1:3000/registration"
      },
      "login": {
        "ui_url": "http://127.0.0.1:3000/login"
      }
    },
    "methods": {
      "password": {
        "enabled": true
      },
      "code": {
        "enabled": false
      },
      "oidc": {
        "enabled": false
      },
      "passkey": {
        "enabled": false
      },
      "webauthn": {
        "enabled": false
      }
    }
  },
  "identity": {
    "default_schema_id": "default",
    "schemas": [
      {
        "id": "default",
        "url": "file:///etc/e2e/identity.schema.json"
      }
    ]
  },
  "log": {
    "level": "info"
  },
  "courier": {
    "smtp": {
      "connection_uri": "smtp://127.0.0.1:1025/?skip_ssl_verify=true"
    }
  }
}
