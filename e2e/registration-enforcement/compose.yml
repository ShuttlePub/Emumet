# Linux-only disposable integration stack; all state is tmpfs, no named volumes.
services:
  postgres:
    image: docker.io/postgres:16
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: emumet
    ports: ["127.0.0.1:15448:5432"]
    tmpfs: ["/var/lib/postgresql/data:rw,size=256m,mode=0700"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guard -d emumet]
      interval: 1s
      timeout: 3s
      retries: 60
  kratos-migrate:
    image: docker.io/oryd/kratos:v1.3.1@sha256:c47903ba278bbcb330b5af4ce43d33dc17adacc1d40456b8e2a235add8ababa5
    network_mode: host
    environment:
      DSN: postgres://guard:fixture-only@127.0.0.1:15448/kratos?sslmode=disable
    command: [migrate, sql, -e, --yes]
    tmpfs: ["/home/ory:rw,size=8m,mode=0777"]
  kratos:
    image: docker.io/oryd/kratos:v1.3.1@sha256:c47903ba278bbcb330b5af4ce43d33dc17adacc1d40456b8e2a235add8ababa5
    network_mode: host
    environment:
      DSN: postgres://guard:fixture-only@127.0.0.1:15448/kratos?sslmode=disable
    command: [serve, -c, /runtime/kratos.json, --dev]
    volumes:
      - ./runtime:/runtime:ro
      - ../../ory/kratos:/etc/config/kratos:ro
    tmpfs: ["/home/ory:rw,size=8m,mode=0777"]
