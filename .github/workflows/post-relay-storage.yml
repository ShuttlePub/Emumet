name: Post relay storage DB
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  post-relay-storage-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: post_relay_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/post_relay_test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Storage, three revokers and shipped capacity entry (no skipped DB acceptance)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kernel --lib post_relay -- --nocapture | tee q1-kernel.log
          cargo test -p driver --lib post_relay -- --skip s1_baseline_real_http --nocapture --test-threads=4 | tee q1-driver.log
          cargo test -p server --bin server post_relay -- --nocapture --test-threads=4 | tee q1-server.log
          cargo test -p server --test post_relay_capacity -- --nocapture | tee q1-capacity.log
          test -z "$(grep -L -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' q1-*.log)"
          ! grep -E 'test result: .* [1-9][0-9]* ignored;' q1-*.log
      - name: Ory-independent startup, fail-closed JWKS and process shutdown/recovery (B1)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p server --bin server auth:: -- --nocapture | tee b1-auth.log
          cargo test -p server --bin server runtime_config:: -- --nocapture | tee b1-config.log
          cargo test -p server --features test-mode --test post_relay_runtime -- --nocapture --test-threads=2 | tee b1-runtime.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' b1-runtime.log
          test -z "$(grep -L -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' b1-*.log)"
          ! grep -E 'test result: .* [1-9][0-9]* ignored;' b1-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-relay-storage-db
          path: |
            q1-*.log
            b1-*.log
