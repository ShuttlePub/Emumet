name: Container

# Pull requests only: build the image, run the smoke test and the release-script tests.
# Nothing here logs in to a registry, pushes an image or creates a Release.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Release scripts and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Script tests
        working-directory: scripts/tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Dockerfile toolchain and digest pinning
        run: python3 scripts/check-container-toolchain.py
      - name: shellcheck
        run: shellcheck scripts/smoke-container.sh scripts/test-publish-local-registry.sh
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/container-ci.yml .github/workflows/release.yml .github/workflows/release-probe.yml

  image:
    name: Build image, smoke test, local-registry publish test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: >-
          docker build
          --build-arg EMUMET_VERSION=0.0.0-ci
          --build-arg "EMUMET_REVISION=$(git rev-parse HEAD)"
          -t emumet-ci:local .
      - name: Smoke test
        run: scripts/smoke-container.sh emumet-ci:local
      - name: Publish control against a local registry
        run: scripts/test-publish-local-registry.sh emumet-ci:local
