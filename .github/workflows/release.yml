name: Release

# A pushed v* tag publishes ghcr.io/shuttlepub/emumet:<tag without v> (linux/amd64 only) and
# creates a GitHub Release (validate -> gate -> image -> release). See docs/releasing.md for the tag rules and for recovery.
on:
  push:
    tags: [ "v*" ]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Script tests
        working-directory: scripts/tests
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Validate the tag (CalVer, existing date, not in the future, on origin/main)
        id: validate
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/validate-release.py "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: The tag must still point at the commit this run was started for
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          [ "$COMMIT" = "$GITHUB_SHA" ] || { echo "tag resolves to $COMMIT but the run is for $GITHUB_SHA" >&2; exit 1; }

  gate:
    name: Registry and Release state of this version
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write only so that DRAFT Releases are visible to the listing (a read-only token
    # cannot see them). Nothing is created or changed here. packages: read for the registry query.
    permissions:
      contents: write
      packages: read
    outputs:
      state: ${{ steps.gate.outputs.state }}
      digest: ${{ steps.gate.outputs.digest }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      TAG: ${{ github.ref_name }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      # absent  -> and no Release (draft or not) exists for the tag, otherwise STOP
      # same    -> the image is already published; the image job verifies it instead of building
      # anything else stops. "Release without image" is never repaired automatically.
      - name: Classify the image and require that no Release exists when it is absent
        id: gate
        run: >-
          python3 scripts/publish-release.py gate
          --version "$VERSION" --revision "$COMMIT" --tag "$TAG"
          --github-repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

  image:
    name: Build, smoke test and publish (or verify) the image
    needs: [validate, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      # the digest that was verified here: pushed-and-read-back, or pulled-and-checked
      digest: ${{ steps.push.outputs.digest || needs.gate.outputs.digest }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      TAG: ${{ github.ref_name }}
      STATE: ${{ needs.gate.outputs.state }}
      PUBLISHED_DIGEST: ${{ needs.gate.outputs.digest }}
      IMAGE_REPOSITORY: ghcr.io/shuttlepub/emumet
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: The gate state must be one this job knows
        run: |
          case "$STATE" in
            absent) ;;
            same) [ -n "$PUBLISHED_DIGEST" ] || { echo "state=same without a digest" >&2; exit 1; } ;;
            *) echo "unexpected gate state '$STATE'" >&2; exit 1 ;;
          esac

      # --- the image does not exist: build, smoke test, push the very same image ---
      - name: Build
        if: needs.gate.outputs.state == 'absent'
        run: >-
          docker build
          --provenance=false --sbom=false
          --build-arg "EMUMET_VERSION=$VERSION"
          --build-arg "EMUMET_REVISION=$COMMIT"
          -t emumet-release:local .
      - name: Smoke test
        if: needs.gate.outputs.state == 'absent'
        run: scripts/smoke-container.sh emumet-release:local
      - name: Log in to GHCR
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
      - name: Push the smoke-tested image and verify it in the registry
        id: push
        if: needs.gate.outputs.state == 'absent'
        run: >-
          python3 scripts/publish-release.py push
          --version "$VERSION" --revision "$COMMIT" --local-image emumet-release:local
          --tag "$TAG" --github-repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

      # --- the image already exists: pull it BY DIGEST and verify it the same way ---
      - name: Pull the published image by digest
        if: needs.gate.outputs.state == 'same'
        run: docker pull "$IMAGE_REPOSITORY@$PUBLISHED_DIGEST"
      - name: Verify the pulled image against the registry (config, layers, labels)
        if: needs.gate.outputs.state == 'same'
        run: >-
          python3 scripts/publish-release.py verify-local
          --version "$VERSION" --revision "$COMMIT"
          --local-image "$IMAGE_REPOSITORY@$PUBLISHED_DIGEST" --expected-digest "$PUBLISHED_DIGEST"
      - name: Smoke test the pulled image
        if: needs.gate.outputs.state == 'same'
        run: scripts/smoke-container.sh "$IMAGE_REPOSITORY@$PUBLISHED_DIGEST"

  release:
    name: GitHub Release
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      TAG: ${{ github.ref_name }}
      VERIFIED_DIGEST: ${{ needs.image.outputs.digest }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      # The registry must still report the digest the image job verified; the managed metadata
      # block of an existing Release must match image, digest and commit exactly.
      - name: Create the Release from the digest the registry reports
        run: >-
          python3 scripts/publish-release.py release
          --version "$VERSION" --revision "$COMMIT" --tag "$TAG"
          --github-repository "$GITHUB_REPOSITORY" --expected-digest "$VERIFIED_DIGEST"
