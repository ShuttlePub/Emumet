implementation_issue_packet:
  issue_title: "認証済みセッションの admin/moderator ロールを GET /api/v1/me で提供"
  issue_kind: feature
  source_execution_unit: moderation-session-context
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: kernel/src/permission.rs, driver/src/keto.rs, application/src/service/session_context.rs, application/src/permission.rs, server/src/route/me.rs, server/src/openapi.rs, server/src/handler.rs
  target_part: "認証済みセッションの context (account_id + instance roles) を Keto 正源で取得し GET /api/v1/me 経由で返す機構"
  dependencies: []
  technical_baseline:
    - "ADR 0004: Keto を admin/moderator ロールの正源とし、GET /api/v1/me で提供する方針"
    - "kernel/src/permission.rs: PermissionChecker::list_instance_roles / InstanceRole"
    - "driver/src/keto.rs: KetoClient GET /relation-tuples によるロール一覧"
    - "application/src/service/session_context.rs: GetSessionContextUseCase"
    - "server/src/route/me.rs: GET /api/v1/me ルートと OpenAPI 定義"
    - "server/src/handler.rs: AppModule への PermissionChecker / KetoClient 配線"
  intent_references:
    - intents/emumet/features/moderation/overview.md
    - intents/emumet/features/moderation/requirements.md
    - intents/emumet/features/moderation/acceptance.md
    - intents/emumet/decisions/0004-admin-moderator-roles-frontend-keto-me.md
  acceptance_criteria:
    - "GET /api/v1/me (Bearer) が account_id と instance_roles (admin/moderator 文字列配列) を 200 で返す"
    - "Keto にロールがない場合は 200 OK + 空配列を返す"
    - "Keto が利用不能な場合は 503 Service Unavailable を返し、空配列にフォールバックしない"
    - "Authorization ヘッダがない場合は 401 Unauthorized を返す"
    - "各 crate の単体/結合テストが通る (kernel 87 / driver 119 / application 31 / server 41 pass)"
    - "cargo fmt と git diff --check がパスする"

