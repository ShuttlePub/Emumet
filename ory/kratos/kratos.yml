{
  "serve": {
    "public": {
      "base_url": "http://localhost:4433/"
    },
    "admin": {
      "base_url": "http://localhost:4434/"
    }
  },
  "selfservice": {
    "default_browser_return_url": "http://localhost:3000/",
    "flows": {
      "registration": {
        "enabled": true,
        "ui_url": "http://localhost:3000/registration",
        "after": {
          "password": {
            "hooks": [
              {
                "hook": "web_hook",
                "config": {
                  "url": "http://127.0.0.1:8081/registration/pre-persist",
                  "method": "POST",
                  "auth": {
                    "type": "api_key",
                    "config": {
                      "name": "Authorization",
                      "value": "__EMUMET_REGISTRATION_GUARD_BEARER__",
                      "in": "header"
                    }
                  },
                  "body": "file:///etc/config/kratos/registration-hook.jsonnet",
                  "response": {
                    "parse": true,
                    "ignore": false
                  },
                  "emit_analytics_event": false
                }
              }
            ]
          }
        }
      },
      "login": {
        "ui_url": "http://localhost:3000/login"
      }
    },
    "methods": {
      "password": {
        "enabled": true
      },
      "code": {
        "enabled": true,
        "passwordless_enabled": false
      },
      "oidc": {
        "enabled": false
      },
      "passkey": {
        "enabled": false
      },
      "webauthn": {
        "enabled": false
      }
    }
  },
  "identity": {
    "default_schema_id": "default",
    "schemas": [
      {
        "id": "default",
        "url": "file:///etc/config/kratos/identity.schema.json"
      }
    ]
  },
  "log": {
    "level": "info"
  },
  "courier": {
    "smtp": {
      "connection_uri": "smtp://localhost:1025/?skip_ssl_verify=true"
    }
  }
}
