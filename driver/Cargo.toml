[package]
name = "driver"
version.workspace = true
edition.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
test-mode = []

[dependencies]
dotenvy = { workspace = true }
deadpool-redis = "0.20.0"
sqlx = { version = "0.7", features = ["time", "postgres", "runtime-tokio-native-tls", "json"] }
serde_json = "1"
serde = { workspace = true }
time = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }

vodca.workspace = true
error-stack = { workspace = true }

rsa = { version = "0.9", features = ["sha2", "pem"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1.7"
hmac = "0.12"
url = "2.5"
sha2 = "0.10"
httpdate = "1"
tokio = { workspace = true, features = ["net", "time"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }

http = "1"
http-body-util = "0.1"
bytes = "1"
http-msgsign = { workspace = true }
http-msgsign-draft = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }

kernel = { path = "../kernel" }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder", "hostname"] }

[dev-dependencies]
kernel = { path = "../kernel", features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "test-util", "io-util", "net", "time", "sync", "rt", "rt-multi-thread"] }
test-with.workspace = true
tempfile = "3"
nanoid = { workspace = true }
wiremock = "0.6"
futures = { version = "0.3", default-features = false, features = ["executor"] }
openssl = "0.10"
native-tls = "0.2"
tokio-native-tls = "0.3"
